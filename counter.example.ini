# Door counter settings. Copy to counter.ini and edit.
# Positions and sizes are fractions of the image width/area, so they stay
# valid if you change the camera resolution.
#
# SETTING UP AT A NEW DOOR - usually only these need changing:
#   [camera]   rotate                      camera mounted on its side?
#   [counting] direction_in                which way is "in"
#   [counting] same_direction_gap_seconds  low mount (sees legs): 1.0
#                                          waist height (sees body): 0.3
#   [upload]   url, secret, device_name    which sheet, and this door's name
# Everything marked (advanced) can normally be left alone.
# After editing: sudo systemctl restart door-counter

[camera]
# Device index (0 = /dev/video0), a device path, or a video file for testing.
source = 0
# Resolution and frame rate requested from the camera.
width = 320
height = 240
fps = 30
# Rotate the image clockwise by 0, 90, 180 or 270 degrees before anything
# else, e.g. if the camera is mounted on its side so people move up/down in
# the raw image. Set it so people move left/right in the preview; zones,
# line and direction_in all refer to the rotated image.
rotate = 0
# (advanced) Frames are shrunk to this width before detection. Lower = faster
# on the Mango, but small or distant people may be missed.
process_width = 160

[counting]
# zones: camera right beside the door, people pass close and fill most of
#        the image. Direction comes from which edge zone sees motion first.
# line:  camera further away, people appear smaller than half the image and
#        are tracked across a counting line.
mode = zones
# Which way counts as "in", as the camera sees it:
# left_to_right or right_to_left
direction_in = left_to_right

# --- zones mode ---
# Merges the 2 legs of one person into 1 count: a second crossing in the
# same direction within this many seconds counts as the same person.
#   Low mount, camera sees legs:      1.0
#   Waist height, camera sees body:   0.3  (or 0 = off)
# Slow walkers counted twice -> raise it.
# People following closely counted as one -> lower it.
# The status page shows how often it merged as merged_as_same_person.
same_direction_gap_seconds = 1.0
# Width of each edge zone, as a fraction of the image width.
# Fast walkers missed -> widen it (e.g. 0.3).
zone_width = 0.2
# (advanced) A zone switches on when this fraction of it shows motion, and
# off again only when it drops below zone_off.
# A zone lights up with nobody there -> raise zone_on.
zone_on = 0.25
zone_off = 0.08
# (advanced) If someone enters one zone but hasn't reached the other within
# this many seconds (e.g. stepped in and back out), nothing is counted.
max_transit_seconds = 1.5
# (advanced) After a pass, both zones must show no motion for this many
# consecutive frames (not seconds; 3 frames is ~0.1 s at 30 fps) before the
# next pass can start. Stops flicker at a zone edge starting a new count.
clear_frames = 3

# --- line mode only (camera further back) ---
# Where the counting line sits across the image: 0.0 = left edge, 1.0 = right.
line_position = 0.5
# Half-width of the band around the line. An object must go from fully left
# of the band to fully right of it (or the reverse) to count. Stops people
# loitering on the line from being counted repeatedly.
band = 0.08
# Ignore moving areas smaller than this fraction of the image (noise, pets
# at a distance, a swinging bag). The preview shows this size as a red square.
min_area = 0.015
# Join pieces of one person that the detector split vertically
# (head/torso/legs). Side effect: two people overlapping side by side,
# one behind the other, count as one.
merge_vertical_splits = true
# Also join pieces sitting side by side with a gap smaller than this
# (fraction of width).
merge_gap = 0.03
# How far (fraction of width) an object may move between frames and still be
# treated as the same object.
max_match_distance = 0.25
# Frames an object may vanish (e.g. briefly blending into the background)
# before it is forgotten.
max_missing_frames = 8
# Someone who stands still long enough fades into the background and is lost.
# If something reappears within revive_distance (fraction of width) of where
# they were lost, within lost_memory_frames, it continues that track, so a
# person who paused in the doorway is still counted when they walk on.
lost_memory_frames = 600
revive_distance = 0.1
# If more than this fraction of the image changes at once (lights switched
# on, sun through a door) don't count anything until it settles.
max_foreground = 0.6

# --- motion detection, both modes ---
# How different a pixel must be from the background to count as moving.
# Motion view (right half of preview) speckled with noise -> raise it (e.g. 40).
var_threshold = 25
# (advanced) How many frames the background model remembers.
history = 300
# (advanced) While someone is in view the background is learned this many
# times more slowly, so a person pausing doesn't fade into it.
presence_learning_factor = 10
# (advanced) Image smoothing and clean-up of the motion view.
blur = 5
kernel = 3
dilate_iterations = 2
# (advanced) Frames to learn the background after starting, before counting.
warmup_frames = 60

[schedule]
# Occupancy resets to 0 at this time every day (24h, local time). The value
# just before the reset is logged as that day's residual.
reset_time = 04:00
# How often an "I'm alive" row (with frames per second) goes to the sheet.
heartbeat_minutes = 60

[upload]
# Google Apps Script web app URL (ends in /exec). Leave empty to only store
# events on the Mango.
url =
# Must match the SECRET script property in the Apps Script project.
secret =
# Name for this location in the sheet. Must be different on every Mango
# that sends to the same sheet.
device_name = front-door
# Events are batched and sent this often. They're queued on the Mango until
# the sheet confirms it received them.
interval_seconds = 60
# (advanced) Most events sent in one request.
batch_size = 200

[storage]
db_path = /var/lib/door-counter/events.db
# Events already uploaded to the sheet are deleted from the Mango after this
# many days (checked at startup and at each daily reset). Events not yet
# uploaded are never deleted. 0 = keep everything.
keep_days = 365

[preview]
# Live low-res view at http://<mango-ip>:8080/ for positioning and tuning.
# Anyone on your network can open it while enabled. Images are never saved.
enabled = true
# 0.0.0.0 = reachable from other machines on the network.
host = 0.0.0.0
port = 8080
# Preview image width and frames per second. Lower if the preview slows the
# counter while open.
width = 320
fps = 5
# Show the detector's motion mask next to the camera view.
show_mask = true
# Show "+1 in" / "+1 out" buttons on the preview page for crossings the
# camera missed. Each press is logged as manual_in / manual_out, counted in
# the day's totals, and kept separate so the sheet shows how many the camera
# caught on its own. Anyone who can open the page can press them.
allow_corrections = true
